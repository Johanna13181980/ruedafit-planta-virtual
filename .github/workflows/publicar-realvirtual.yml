name: Publicar RuedaFit con realvirtual Community
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos RuedaFit
        uses: actions/checkout@v4
      - name: Descargar codigo oficial realvirtual Community
        run: git clone --depth 1 https://github.com/game4automation/realvirtual-WEB.git /tmp/realvirtual
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias oficiales
        working-directory: /tmp/realvirtual
        run: npm ci
      - name: Compilar visualizador realvirtual en subruta /viewer/
        working-directory: /tmp/realvirtual
        run: npm run build -- --base=/ruedafit-planta-virtual/viewer/
      - name: Preparar sitio completo
        run: |
          mkdir -p site/viewer site/modelos
          cp -R /tmp/realvirtual/dist/. site/viewer/
          cp modelos/ruedafit_planta.glb site/modelos/
          cp ruedafit-realvirtual.html site/
          if [ -f index.html ]; then cp index.html site/; fi
          if [ ! -f site/index.html ]; then cp ruedafit-realvirtual.html site/index.html; fi
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
